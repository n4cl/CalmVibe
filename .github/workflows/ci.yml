name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve Node Version
        id: node_version
        run: |
          version="$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)"
          if [ -z "$version" ]; then
            echo "mise.toml から Node バージョンを取得できませんでした" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: npm
          cache-dependency-path: calmvibe/package-lock.json
      - name: Install
        run: npm ci
        working-directory: calmvibe
      - name: Lint
        run: npm run lint
        working-directory: calmvibe
      - name: Test
        run: npm test -- --runInBand
        working-directory: calmvibe
      - name: Web Build
        run: npx expo export -p web
        working-directory: calmvibe
      - name: Build
        run: npm run build --if-present
        working-directory: calmvibe
